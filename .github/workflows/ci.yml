# ci.yml: build + host tests on every push and pull request; release on a version tag (X.Y.Z, no `v`).
# The release builds one image per row of release_matrix.csv, one job per chip.
name: ci
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-build.yml@3.1.6
    with:
      strict_lint: true
  release:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-release.yml@3.1.6
    with:
      timeout_minutes: 90
