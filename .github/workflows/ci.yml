# ci.yml: build + host tests on every push and pull request; release on a version tag (X.Y.Z, no `v`).
# The logic lives in xewe-os-tools (.github/workflows/, doc/ci.md); this file only calls it.
# The release builds every row of release_matrix.csv (chip plus LED data/clock pin, one image per
# row, in static/firmware/releases/<version>/<chip>/<data>/<clock>/), publishes a GitHub Release,
# then commits static/firmware/releases/<version>/ to main (Git LFS, see .gitattributes).
name: ci
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-build.yml@partition-scheme
    with:
      strict_lint: true
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: xewe-labs/xewe-os-tools/.github/workflows/xewe-release.yml@partition-scheme
    with:
      publish_branch: true
      releases_branch: main
