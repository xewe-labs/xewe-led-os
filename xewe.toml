# xewe.toml: this firmware's manifest (pinned inputs). Edit by hand or with `xewe manifest update`.
# ./setup.sh installs exactly these refs into build/. A tag freezes; ref = "latest" tracks the newest
# commit of the default branch (development); `xewe manifest update` freezes it at the newest tag.
schema = 1

[project]
name = "xewe-led-os"
version = "3.0.0"
chip = "s3"

[build]
partition_scheme = "huge_app"

[core]
repo = "https://github.com/xewe-labs/xewe-os-core"
ref = "3.1.0"

[modules]
repo = "https://github.com/xewe-labs/xewe-os-modules"
ref = "3.1.0"
selected = ["led", "wifi", "web-interface", "led-web", "time", "scheduler", "buttons"]

[tools]
repo = "https://github.com/xewe-labs/xewe-os-tools"
ref = "3.1.0"

[libraries]
ArduinoJson = { repo = "https://github.com/bblanchon/ArduinoJson", ref = "v7.4.3" }
HomeSpan = { repo = "https://github.com/xewe-labs/xewe-led-library-homespan", ref = "324f5963431aa1e7fc332dae36dca79917a4d5c2" }
Espalexa = { repo = "https://github.com/xewe-labs/xewe-led-library-espalexa", ref = "5e6617d969c76af58608178837bb3cace5cf6342" }
PubSubClient = { repo = "https://github.com/knolleary/pubsubclient", ref = "v2.8" }
